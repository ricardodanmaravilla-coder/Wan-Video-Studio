steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build','-f','Dockerfile.web','-t','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA','.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=900'
      - '--set-env-vars=WORKER_MODE=gradio,HF_SPACE_T2V=${_HF_SPACE_T2V},HF_SPACE_I2V=${_HF_SPACE_I2V}'

substitutions:
  _REGION: us-central1
  _REPOSITORY: wan-video
  _IMAGE: wan-video-web
  _SERVICE: wan-video-studio
  _HF_SPACE_T2V: RicasMaravilla/wan-video-studio-t2v
  _HF_SPACE_I2V: RicasMaravilla/wan-video-studio-i2v

options:
  logging: CLOUD_LOGGING_ONLY
